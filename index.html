<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタイリッシュ企画書メーカー</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- PDF出力用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <!-- ヘッダー -->
    <header class="header">
        <div class="header-content">
            <h1 class="app-title">✨ 企画書メーカー</h1>
            <p class="app-subtitle">訴求力の高い企画書を数分で作成</p>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-container">
        <!-- 左側：入力エリア -->
        <section class="editor-panel">
            <div class="panel-header">
                <h2>📝 企画書の内容を入力</h2>
            </div>

            <!-- 画像アップロード（Phase 2新機能） -->
            <div class="input-group">
                <label for="proposal-image">📸 ロゴ・画像をアップロード</label>
                <input
                    type="file"
                    id="proposal-image"
                    accept="image/*"
                    class="file-input"
                >
                <div class="image-preview-container" id="image-preview-container" style="display: none;">
                    <img id="image-preview" src="" alt="プレビュー画像">
                    <button type="button" class="remove-image-btn" id="remove-image-btn">✕ 画像を削除</button>
                </div>
            </div>

            <div class="input-group">
                <label for="proposal-title">企画タイトル</label>
                <input
                    type="text"
                    id="proposal-title"
                    placeholder="例：新商品販売促進キャンペーン"
                    maxlength="50"
                >
            </div>

            <div class="input-group">
                <label for="proposal-subtitle">サブタイトル</label>
                <input
                    type="text"
                    id="proposal-subtitle"
                    placeholder="例：若年層をターゲットにしたSNS戦略"
                    maxlength="80"
                >
            </div>

            <div class="input-group">
                <label for="proposal-objective">企画の目的</label>
                <textarea
                    id="proposal-objective"
                    rows="4"
                    placeholder="この企画で達成したい目標を記入してください"
                ></textarea>
            </div>

            <div class="input-group">
                <label for="proposal-target">ターゲット</label>
                <input
                    type="text"
                    id="proposal-target"
                    placeholder="例：20-30代の女性、SNS利用者"
                >
            </div>

            <div class="input-group">
                <label for="proposal-content">企画内容</label>
                <textarea
                    id="proposal-content"
                    rows="6"
                    placeholder="企画の具体的な内容を記入してください"
                ></textarea>
            </div>

            <div class="input-group">
                <label for="proposal-benefits">期待される効果</label>
                <textarea
                    id="proposal-benefits"
                    rows="4"
                    placeholder="この企画によって得られる効果やメリットを記入してください"
                ></textarea>
            </div>

            <div class="input-group">
                <label for="proposal-budget">予算</label>
                <input
                    type="text"
                    id="proposal-budget"
                    placeholder="例：100万円"
                >
            </div>

            <!-- テンプレート選択 -->
            <div class="template-selector">
                <h3>🎨 デザインテンプレート</h3>
                <div class="template-buttons">
                    <button class="template-btn active" data-template="modern">
                        モダン
                    </button>
                    <button class="template-btn" data-template="professional">
                        プロフェッショナル
                    </button>
                    <button class="template-btn" data-template="creative">
                        クリエイティブ
                    </button>
                </div>
            </div>

            <!-- カラーカスタマイズ（Phase 2新機能） -->
            <div class="color-customizer">
                <h3>🎨 カラーカスタマイズ</h3>
                <div class="color-picker-group">
                    <div class="color-picker-item">
                        <label for="primary-color">メインカラー</label>
                        <input type="color" id="primary-color" value="#667eea">
                    </div>
                    <div class="color-picker-item">
                        <label for="secondary-color">アクセントカラー</label>
                        <input type="color" id="secondary-color" value="#764ba2">
                    </div>
                </div>
                <button class="reset-color-btn" id="reset-color-btn">デフォルトに戻す</button>
            </div>

            <!-- アクションボタン（Phase 2新機能） -->
            <div class="action-buttons">
                <h3>💾 保存・出力</h3>
                <div class="button-grid">
                    <button class="action-btn save-btn" id="save-btn">
                        💾 保存する
                    </button>
                    <button class="action-btn load-btn" id="load-btn">
                        📂 読み込む
                    </button>
                    <button class="action-btn pdf-btn" id="pdf-btn">
                        📄 PDFで出力
                    </button>
                    <button class="action-btn clear-btn" id="clear-btn">
                        🗑️ クリア
                    </button>
                </div>
                <div class="save-status" id="save-status"></div>
            </div>
        </section>

        <!-- 右側：プレビューエリア -->
        <section class="preview-panel">
            <div class="panel-header">
                <h2>👁️ リアルタイムプレビュー</h2>
            </div>

            <div class="preview-container">
                <div id="proposal-preview" class="proposal-document modern">
                    <div class="doc-header">
                        <div class="doc-image-container" id="doc-image-container" style="display: none;">
                            <img id="doc-image" src="" alt="企画書画像">
                        </div>
                        <h1 class="doc-title">企画タイトルを入力してください</h1>
                        <p class="doc-subtitle">サブタイトルを入力してください</p>
                    </div>

                    <div class="doc-section">
                        <h2 class="section-title">📍 企画の目的</h2>
                        <p class="section-content">企画の目的を入力してください</p>
                    </div>

                    <div class="doc-section">
                        <h2 class="section-title">🎯 ターゲット</h2>
                        <p class="section-content">ターゲットを入力してください</p>
                    </div>

                    <div class="doc-section">
                        <h2 class="section-title">💡 企画内容</h2>
                        <p class="section-content">企画内容を入力してください</p>
                    </div>

                    <div class="doc-section">
                        <h2 class="section-title">✨ 期待される効果</h2>
                        <p class="section-content">期待される効果を入力してください</p>
                    </div>

                    <div class="doc-section">
                        <h2 class="section-title">💰 予算</h2>
                        <p class="section-content">予算を入力してください</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
